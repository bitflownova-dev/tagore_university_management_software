version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: tagore-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: tagore_university
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - tagore-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: tagore-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - tagore-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Backend API
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: tagore-backend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres123
      DATABASE_NAME: tagore_university
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: development-secret-key-change-in-production
      JWT_EXPIRATION: 15m
      JWT_REFRESH_SECRET: development-refresh-secret
      JWT_REFRESH_EXPIRATION: 7d
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tagore-network
    volumes:
      - ../backend/src:/app/src
      - /app/node_modules

  # Database Admin UI (Adminer)
  adminer:
    image: adminer:latest
    container_name: tagore-adminer
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    networks:
      - tagore-network

volumes:
  postgres_data:
  redis_data:

networks:
  tagore-network:
    driver: bridge
